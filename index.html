<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренажер таблиці множення та ділення</title>
  <!-- Підключення якісних векторних іконок -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Фон із плаваючими елементами -->
  <div class="floating-container" id="floatingBg"></div>

  <div class="container">
    <h1>Тренажер знань</h1>

    <!-- Перемикач теми -->
    <div class="theme-selector">
      <label for="themeSelect">Обери всесвіт: </label>
      <select id="themeSelect" onchange="changeTheme()">
        <option value="marvel">🦸‍♂️ Marvel</option>
        <option value="anime">🍥 Аніме</option>
        <option value="cars">🏎️ Машини</option>
        <option value="moto">🏍️ Мотоцикли</option>
        <option value="football">⚽ Футбол</option>
      </select>
    </div>

    <!-- Картка з завданням -->
    <div class="card">
      <div id="question" class="question">5 × 5</div>
      <input type="number" id="answer-input" placeholder="Введіть відповідь" autofocus>
      <br>

      <div class="buttons-group">
        <button id="check-btn" onclick="checkAnswer()">Перевірити</button>
        <button id="hint-btn" onclick="openModal()">💡 Підказка</button>
      </div>

      <p id="result-message"></p>
    </div>
  </div>

  <!-- Модальне вікно з табличкою -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2>Шпоргалка</h2>
      
      <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTable('mult')">Таблиця множення</button>
        <button class="tab-btn" onclick="switchTable('div')">Таблиця ділення</button>
      </div>

      <div id="table-container" class="table-grid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
